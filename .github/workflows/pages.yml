name: Deploy research showcase to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, arena/01a0b34a-fly]
    paths:
      - "fly-ideas/src/**"
      - "fly-ideas/public/**"
      - "fly-ideas/index.html"
      - "fly-ideas/package.json"
      - "fly-ideas/package-lock.json"
      - "fly-ideas/vite.config.ts"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fly-ideas/package-lock.json
      - name: Install
        working-directory: fly-ideas
        run: npm ci
      - name: Build public showcase
        working-directory: fly-ideas
        env:
          VITE_PUBLIC_SHOWCASE: "1"
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fly-ideas/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
